le ({path}) is gone, so the connection is broken.","doctor.msg.hook-wiring.settings-missing.fix":"Run `memesh install-hooks` again.","doctor.msg.hook-wiring.settings-invalid.summary":"{path} is damaged (not valid JSON).","doctor.msg.hook-wiring.settings-invalid.fix":"Restore it from a backup, or run `memesh install-hooks` to recreate it.","doctor.msg.hook-wiring.entries-removed.summary":"The memesh entries were removed from {path}, so the connection is broken.","doctor.msg.hook-wiring.entries-removed.fix":"Run `memesh install-hooks` again.","doctor.msg.hook-wiring.root-moved.summary":"The connection points at {path}, which no longer exists (memesh probably moved).","doctor.msg.hook-wiring.root-moved.fix":"Run `memesh install-hooks` to refresh it.","doctor.msg.hook-activity.never-ran.summary":"No capture hook has run in the {hours} hours since tracking began, even though hook wiring is in place — nothing is being remembered.","doctor.msg.hook-activity.never-ran.fix":"Finish one work session, then run `memesh doctor` again. If it still says no hook has run, run `memesh install-hooks` and restart your agent.","doctor.msg.hook-activity.stale.summary":"The last capture hook ran about {hours} hours ago ({hook}). If you have worked since then, capture has stopped and nothing from those sessions was saved.","doctor.msg.hook-activity.stale.fix":"Restart your agent, end one session, then run `memesh doctor` again. If it does not recover, run `memesh install-hooks`.","doctor.msg.hook-activity.stale-unconfirmed.summary":"The session-summary hook last ran about {hours} hours ago, and no Claude Code writes landed in the last 3 days either. If this machine has moved to another agent (Codex / Gemini), this is expected; if you still use Claude Code here, capture has stopped.","doctor.msg.hook-activity.stale-unconfirmed.fix":"If you still use Claude Code on this machine: restart it, end one session, and re-run `memesh doctor`. If it does not recover, run `memesh install-hooks`.","doc 工作階段後再跑 `memesh doctor`——新的一次執行會把壞掉的時間蓋掉。","doctor.msg.hook-activity.disabled.summary":"自動擷取已關閉（MEMESH_AUTO_CAPTURE 或設定檔的 autoCapture）——這是刻意設定，hook 沒動靜是預期中的。想恢復擷取就把它打開。","doctor.msg.hook-activity.disabled-env.summary":"自動擷取被這個 shell 環境中的 MEMESH_AUTO_CAPTURE=false 關閉了。doctor 只能看到自己所在的環境——如果你的 agent 執行時沒有這個變數，那邊的擷取不受影響。","doctor.msg.hook-activity.not-wired.summary":"從來沒有任何擷取 hook 執行過——而且這台機器上沒有確認接好任何擷取 hook（Stop / PostToolUse / PreCompact），所以本來就沒有東西可以執行。","doctor.msg.hook-activity.not-wired.fix":"想要自動擷取就執行 `memesh install-hooks`。如果這個安裝只走 MCP（Codex / Gemini），這是正常狀態，可以放心忽略。","doctor.msg.hook-activity.stop-silent.summary":"{hook} hook 有在蓋章，但從開始追蹤到現在 {hours} 小時，session-summary hook 一次都沒跑過——session 擷取可能壞了，只是被 commit 擷取蓋住看不見。","doctor.msg.hook-activity.stop-silent.fix":"完整結束一次工作階段再跑 `memesh doctor`。如果 session-summary 還是沒跑過，執行 `memesh install-hooks` 然後重啟 agent。","doctor.msg.hook-activity.never-ran-legacy.summary":"沒有任何 hook 蓋過心跳章，但追蹤開始以來已存入 {captured} 筆自動擷取的記憶——很可能是心跳追蹤之前版本的 hook 還在執行。","doctor.msg.hook-activity.never-ran-legacy.fix":"把 memesh hooks 更新到目前版本（plugin 安裝：`/plugin update memesh`；npm 安裝：`memesh install-hooks`），然後重啟 agent。","doctor.msg.node-runtime.too-old.summary":"你的 Node.js 版本比這個套件支援的還舊。{detail}","doctor.msg.node-runtime.too-old.fix":"把 Node.js 升級到 {required} 以上，再執行 `memesh doctor`。","doctor.msg.native-binding.node-too-old.summary":"這個版本的 Node 內建的 SQLite 對 memesh 來說太舊，載不動「用意思搜尋」那一塊。完整版本是 Node 22.13 才有的。","doctor.msg.native-binding.node-too-old.fix":"把 Node 升到 22.13 以上，再執行一次 `memesh doctor`。","doctor.msg.native-binding.not-installed.summary":"sqlite-vec 沒有安裝。記憶還是會存、也還找得到，只是不能用「意思相近」來搜尋。","doctor.msg.native-binding.not-installed.fix":"在使用 @pcircle/memesh 的資料夾執行 `npm install`。","doctor.msg.native-binding.load-failed.summary":"sqlite-vec 載入失敗：{detail}。搜尋只能用關鍵字。","doctor.msg.native-binding.load-failed.fix":'執行：cd "{root}" && npm install --omit=dev',"doctor.msg.shell-cli.not-on-path.summary":"終端機裡打 `memesh` 找不到指令。Claude Code 的功能不受影響——只影響你自己在終端機操作。","doctor.msg.shell-c sing.summary":"这些 hook 脚本不见了：{files}","doctor.msg.hook-scripts.missing.fix":"重新安装 MeMesh 即可恢复。","doctor.msg.hook-scripts.not-executable.summary":"这些 hook 脚本存在但没有执行权限：{files}","doctor.msg.hook-scripts.not-executable.fix":"运行 `chmod +x scripts/hooks/*.js`；源码安装则跑 `npm run build`。","doctor.msg.hook-wiring.no-marker.summary":"memesh 还没接入 Claude Code，所以不会自动记住任何东西。","doctor.msg.hook-wiring.no-marker.fix":"运行一次 `memesh install-hooks` 完成连接，再用 `memesh doctor` 确认。","doctor.msg.hook-wiring.script-missing.summary":"已接线的 memesh hook 指向 {path}，但这个文件已不存在——agent 每次触发对应事件都会调用一个不存在的文件。通常是升级移除某个 hook 后留下的残留。","doctor.msg.hook-wiring.script-missing.fix":"运行 `memesh install-hooks` 重新接线（它会移除已退役的条目），然后重启你的 agent。","doctor.msg.hook-wiring.marker-unreadable.summary":"{path} 的连接记录读不到。","doctor.msg.hook-wiring.marker-unreadable.fix":"再运行一次 `memesh install-hooks`。","doctor.msg.hook-wiring.marker-malformed.summary":"连接记录已损坏。","doctor.msg.hook-wiring.marker-malformed.fix":"再运行一次 `memesh install-hooks`。","doctor.msg.hook-wiring.settings-missing.summary":"Claude Code 的设置文件（{path}）不见了，连接已中断。","doctor.msg.hook-wiring.settings-missing.fix":"再运行一次 `memesh install-hooks`。","doctor.msg.hook-wiring.settings-invalid.summary":"{path} 已损坏（不是有效的 JSON）。","doctor.msg.hook-wiring.settings-invalid.fix":"从备份恢复，或用 `memesh install-hooks` 重建。","doctor.msg.hook-wiring.entries-removed.summary":"{path} 里的 memesh 配置被移除了，连接已中断。","doctor.msg.hook-wiring.entries-removed.fix":"再运行一次 `memesh install-hooks`。","doctor.msg.hook-wiring.root-moved.summary":"连接指向的 {path} 已不存在（memesh 可能被移动了）。","doctor.msg.hook-wiring.root-moved.fix":"运行 `memesh install-hooks` 更新路径。","doctor.msg.hook-activity.never-ran.summary":"从开始追踪到现在 {hours} 小时，没有任何抓取 hook 跑过——而 hook 接线是好的，代表它们该跑却没跑，没有任何东西被记下来。","doctor.msg.hook-activity.never-ran.fix":"完整用一次工作会话，再跑 `memesh doctor`。如果还是说没有 hook 跑过，执行 `memesh install-hooks` 然后重启 agent。","doctor.msg.hook-activity.stale.summary":"最后一次抓取 hook 是大约 {hours} 小时前跑的（{hook}）。如果你这段时间有在工作，代表抓取已经停了，那些会话的内容都没被存下来。","doctor.msg.hook-activity.stale.fix":"重启 agent，结束一次工作会话，再跑 `memesh doctor`。如果没恢复，执行 `memesh install-hooks`。","doctor.msg.hook-activity.stale-unconfirmed.summary":"session-summary hook 上次运行大约在 {hours} 小时前，而且过去 3 天也没有任何 Claude Code 的写入。如果这台机器已改用其他 agent（Codex / Gemini），这是正常的；如果你在这里仍使用 Claude Code，捕获已经停了。","doctor.msg.hook-activity.stale-unconfirmed.fix":"如果这台机器仍在使用 Claude Code：重启它、结束一个 session，再运行一次 `memesh doctor`。若仍未恢复，运行 `memesh install-hooks`。","doctor.msg.hook-activity.query-failed.summary":"读不到 hook 活动记录：{detail}。抓取状态现在是「不知道」，那跟「正常」不是同一件事。","doctor.msg.hook-activity.query-failed.fix":"用 `memesh doctor --verbose` 看完整错误，并确认 ~/.memesh 读得到、磁盘没满。","doctor.msg.hook-activity.stale-unknown.summary":"{hook} hook 的最后执行时间读不出来（数据坏了，或是被时钟不准的机器盖的章）。抓取状态现在是「不知道」，那跟「正常」不是同一件事。","doctor.msg.hook-activity.stale-unknown.fix":"结束一次工作会话后再跑 `memesh doctor`——新的一次执行会把坏掉的时间盖掉。","doctor.msg.hook-activity.disabled.summary":"自动抓取已关闭（MEMESH_AUTO_CAPTURE 或配置文件的 autoCapture）——这是刻意设置，hook 没动静是预期中的。想恢复抓取就把它打开。","doctor.msg.hook-activity.disabled-env.summary":"自动捕获被这个 shell 环境中的 MEMESH_AUTO_CAPTURE=false 关闭了。doctor 只能看到自己所在的环境——如果你的 agent 运行时没有这个变量，那边的捕获不受影响。","doctor.msg.hook-activity.not-wired.summary":"从来没有任何捕获 hook 运行过——而且这台机器上没有确认接好任何捕获 hook（Stop / PostToolUse / PreCompact），所以本来就没有东西可以运行。","doctor.msg.hook-activity.not-wired.fix":"想要自动抓取就执行 `memesh install-hooks`。如果这个安装只走 MCP（Codex / Gemini），这是正常状态，可以放心忽略。","doctor.msg.hook-activity.stop-silent.summary":"{hook} hook 有在盖章，但从开始追踪到现在 {hours} 小时，session-summary hook 一次都没跑过——session 抓取可能坏了，只是被 commit 抓取盖住看不见。","doctor.msg.hook-activity.stop-silent.fix":"完整结束一次工作会话再跑 `memesh doctor`。如果 session-summary 还是没跑过，执行 `memesh install-hooks` 然后重启 agent。","doctor.msg.hook-activity.never-ran-legacy.summary":"没有任何 hook 盖过心跳章，但追踪开始以来已存入 {captured} 条自动捕获的记忆——很可能是心跳追踪之前版本的 hook 还在运行。","doctor.msg.hook-activity.never-ran-legacy.fix":"把 memesh hooks 更新到当前版本（plugin 安装：`/plugin update memesh`；npm 安装：`memesh install-hooks`），然后重启 agent。","doctor.msg.node-runtime.too-old.summary":"你的 Node.js 版本比这个包支持的还旧。{detail}","doctor.msg.node-runtime.too-old.fix":"把 Node.js 升级到 {required} 以上，再运行 `memesh doctor`。","doctor.msg.native-binding.node-too-old.summary":"这个版本的 Node 内置的 SQLite 对 memesh 来说太旧，加载不了「按意思搜索」那一块。完整版本是 Node 22.13 才有的。","doctor.msg.native-binding.node-too-old.fix":"把 Node 升到 22.13 以上，再运行一次 `memesh doctor`。","doctor.msg.native-binding.not-installed.summary":"sqlite-vec 没有安装。记忆还是会存、也还找得到，只是不能用「意思相近」来搜索。","doctor.msg.native-binding.not-installed.fix":"在使用 @pcircle/memesh 的文件夹运行 `npm install`。","doctor.msg.native-binding.load-failed.summary":"sqlite-vec 加载失败：{detail}。搜索只能用关键词。","doctor.msg.native-binding.load-failed.fix":'运行：cd "{root}" && npm install --omit=dev',"doctor.msg.shell-cli.not-on-path.summary":"终端里打 `memesh` 找不到命令。Claude Code 的功能不受影响——只影响你自己在终端操作。","doctor.msg.shell-cli.not-on-path.fix":"运行 `npm install -g @pcircle/memesh` 补上。两种安装共用同一份记忆。","doctor.msg.dashboard.missing.summary":"仪表板的文件不见了。","doctor.msg.dashboard.missing.fix":"用 `cd dashboard && npm install && npm run build` 重建。","doctor.msg.update-status.no-cache.summary":"memesh 还没成功查过有没有新版本，所以无法告诉你要不要更新。","doctor.msg.update-status.no-cache.fix":"联网时运行一次 `memesh status`，查到结果后这条提醒就会消失。","doctor.msg.update-status.deprecated.summary":"你装的 {version} 已被官方下架：{detail}","doctor.msg.update-status.deprecated.fix":"请立即更新——运行 `memesh update`（或按你的安装方式升级）。","doctor.msg.update-status.deprecation-unknown.summary":"无法确认 {version} 这个版本是否仍然安全：{detail}","doctor.msg.update-status.deprecation-unknown.fix":"联网时运行 `memesh status` 重试。","doctor.msg.update-status.update-available.summary":"有新版本：{latest}（当前是 {current}）。","doctor.msg.update-status.update-available.fix":"运行 `memesh update` 升级。","doctor.msg.update-status.stale.summary":"{version} 已是最新，但更新信息有点旧了。","doctor.msg.update-status.stale.fix":"联网时运行 `memesh status` 刷新一下。","doctor.msg.http-probe.bad-status.summary":"{url} 的本机服务器返回了错误（HTTP {status}）。","doctor.msg.http-probe.bad-status.fix":"用 `memesh serve` 重启并查看日志。","doctor.msg.http-probe.no-server.summa {path}를 고치거나 MeMesh를 다시 설치하세요.","doctor.msg.hooks-config.missing-types.summary":"hooks/hooks.json에 다음 훅 유형이 없습니다: {types}. 일부 자동 기록이 실행되지 않습니다.","doctor.msg.hooks-config.missing-types.fix":"기본 제공 훅 구성을 복원하거나 MeMesh를 다시 설치하세요.","doctor.msg.hook-scripts.none.summary":"훅 설정에 스크립트가 하나도 없어서 아무것도 자동으로 기록되지 않습니다.","doctor.msg.hook-scripts.none.fix":"MeMesh를 다시 설치하세요.","doctor.msg.hook-scripts.missing.summary":"다음 훅 스크립트가 없습니다: {files}","doctor.msg.hook-scripts.missing.fix":"MeMesh를 다시 설치하면 복원됩니다.","doctor.msg.hook-scripts.not-executable.summary":"다음 훅 스크립트는 있지만 실행 권한이 없습니다: {files}","doctor.msg.hook-scripts.not-executable.fix":"`chmod +x scripts/hooks/*.js`를 실행하세요. 소스 설치라면 `npm run build`를 실행하세요.","doctor.msg.hook-wiring.no-marker.summary":"memesh가 아직 Claude Code에 연결되지 않아 아무것도 자동으로 기억되지 않습니다.","doctor.msg.hook-wiring.no-marker.fix":"`memesh install-hooks`를 한 번 실행한 뒤 `memesh doctor`로 확인하세요.","doctor.msg.hook-wiring.script-missing.summary":"연결된 memesh 훅이 {path}를 가리키지만 이 파일은 더 이상 존재하지 않습니다 — 에이전트가 해당 이벤트마다 없는 파일을 호출합니다. 보통 훅을 은퇴시킨 업그레이드가 남긴 잔재입니다.","doctor.msg.hook-wiring.script-missing.fix":"`memesh install-hooks`를 실행해 다시 연결하고(은퇴한 항목은 제거됩니다) 에이전트를 재시작하세요.","doctor.msg.hook-wiring.marker-unreadable.summary":"{path}의 연결 기록을 읽을 수 없습니다.","doctor.msg.hook-wiring.marker-unreadable.fix":"`memesh install-hooks`를 다시 실행하세요.","doctor.msg.hook-wiring.marker-malformed.summary":"연결 기록이 손상되었습니다.","doctor.msg.hook-wiring.marker-malformed.fix":"`memesh install-hooks`를 다시 실행하세요.","doctor.msg.hook-wiring.settings-missing.summary":"Claude Code 설정 파일({path})이 사라져 연결이 끊어졌습니다.","doctor.msg.hook-wiring.settings-missing.fix":"`memesh install-hooks`를 다시 실행하세요.","doctor.msg.hook-wiring.settings-invalid.summary":"{path}가 손상되었습니다(올바른 JSON이 아님).","doctor.msg.hook-wiring.settings-invalid.fix":"백업에서 복원하거나 `memesh install-hooks`로 다시 만드세요.","doctor.msg.hook-wiring.entries-removed.summary":"{path}에서 memesh 항목이 제거되어 연결이 끊어졌습니다.","doctor.msg.hook-wiring.entries-removed.fix":"`memesh install-hooks`를 다시 실행하세요.","doctor.msg.hook-wiring.root-moved.summary":"연결이 가리키는 {path}가 더 이상 존재하지 않습니다(memesh가 옮겨졌을 수 있음).","doctor.msg.hook-wiring.root-moved.fix":"`memesh install-hooks`를 실행해 갱신하세요.","doctor.msg.hook-activity.never-ran.summary":"추적을 시작한 뒤 {hours}시간 동안 캡처 훅이 한 번도 실행되지 않았습니다. 훅 연결은 정상이므로 실행되어야 할 것이 돌지 않고 있고, 아무것도 기억되지 않고 있습니다.","doctor.msg.hook-activity.never-ran.fix":"작업 세션을 한 번 마친 뒤 `memesh doctor`를 다시 실행하세요. 여전히 훅이 실행되지 않았다고 나오면 `memesh install-hooks`를 실행하고 에이전트를 재시작하세요.","doctor.msg.hook-activity.stale.summary":"마지막 캡처 훅 실행은 약 {hours}시간 전입니다({hook}). 그 뒤로 작업했다면 캡처가 멈춘 것이며 해당 세션의 내용은 저장되지 않았습니다.","doctor.msg.hook-activity.stale.fix":"에이전트를 재시작하고 세션을 한 번 마친 뒤 `memesh doctor`를 다시 실행하세요. 회복되지 않으면 `memesh install-hooks`를 실행하세요.","doctor.msg.hook-activity.stale-unconfirmed.summary":"session-summary 훅이 마지막으로 실행된 것은 약 {hours}시간 전이고, 지난 3일간 Claude Code의 쓰기도 없었습니다. 이 머신이 다른 에이전트(Codex / Gemini)로 옮겨갔다면 정상입니다. 여기서 아직 Claude Code를 쓰고 있다면 캡처가 멈춘 것입니다.","doctor.msg.hook-activity.stale-unconfirmed.fix":"이 머신에서 아직 Claude Code를 쓴다면: 재시작하고 세션을 한 번 끝낸 뒤 `memesh doctor`를 다시 실행하세요. 회복되지 않으면 `memesh install-hooks`를 실행하세요.","doctor.msg.hook-activity.query-failed.summary":'데이터베이스에서 훅 활동을 읽지 못했습니다: {detail}. 캡처 상태는 "알 수 없음"이며 이는 "정상"과 다릅니다.',"doctor.msg.hook-activity.query-failed.fix":"`memesh doctor --verbose`로 전체 오류를 확인하고 ~/.memesh를 읽을 수 있는지, 디스크가 가득 차지 않았는지 확인하세요.","doctor.msg.hook-activity.stale-unknown.summary":'{hook} 훅의 마지막 실행 시각을 읽을 수 없습니다(데이터 손상, 또는 시계가 어긋난 머신이 기록했을 수 있음). 캡처 상태는 "알 수 없음"이며, 이는 "정상"과 같지 않습니다.',"doctor.msg.hook-activity.stale-unknown.fix":"작업 세션을 한 번 끝낸 뒤 `memesh doctor`를 다시 실행하세요. 새 실행이 잘못된 타임스탬프를 덮어씁니다.","doctor.msg.hook-activity.disabled.summary":"자동 캡처가 꺼져 있습니다(MEMESH_AUTO_CAPTURE 또는 설정의 autoCapture). 의도된 설정이므로 훅이 조용한 것은 예상된 동작입니다. 다시 켜면 캡처가 재개됩니다.","doctor.msg.hook-activity.disabled-env.summary":"이 shell 환경의 MEMESH_AUTO_CAPTURE=false 때문에 자동 캡처가 꺼져 있습니다. doctor는 자신의 환경만 볼 수 있습니다 — 에이전트가 이 변수 없이 실행 중이라면 그쪽 캡처는 영향을 받지 않습니다.","doctor.msg.hook-activity.not-wired.summary":"캡 a escrita do Claude Code chegou nos últimos 3 dias. Se esta máquina passou a usar outro agente (Codex / Gemini), isto é esperado; se você ainda usa Claude Code aqui, a captura parou.","doctor.msg.hook-activity.stale-unconfirmed.fix":"Se você ainda usa Claude Code nesta máquina: reinicie-o, termine uma sessão e execute `memesh doctor` de novo. Se não recuperar, execute `memesh install-hooks`.","doctor.msg.hook-activity.query-failed.summary":"Não foi possível ler a atividade dos hooks na base de dados: {detail}. O estado da captura é desconhecido, o que não é o mesmo que saudável.","doctor.msg.hook-activity.query-failed.fix":"Execute `memesh doctor --verbose` para ver o erro completo e verifique que ~/.memesh é legível e que há espaço em disco.","doctor.msg.hook-activity.stale-unknown.summary":'O timestamp da última execução do hook {hook} não pode ser lido (corrompido, ou gravado por uma máquina com relógio errado). O estado da captura é "desconhecido", o que não é o mesmo que "saudável".',"doctor.msg.hook-activity.stale-unknown.fix":"Termine uma sessão de trabalho e execute `memesh doctor` de novo — uma execução nova sobrescreve o timestamp inválido.","doctor.msg.hook-activity.disabled.summary":"A captura automática está desligada (MEMESH_AUTO_CAPTURE ou autoCapture na configuração) — deliberadamente, então o silêncio dos hooks é esperado. Reative para voltar a capturar sessões.","doctor.msg.hook-activity.disabled-env.summary":"A captura automática está desligada por MEMESH_AUTO_CAPTURE=false no ambiente deste shell. O doctor só enxerga o próprio ambiente — se o seu agente roda sem esta variável, a captura lá não é afetada.","doctor.msg.hook-activity.not-wired.summary":"Nenhum hook de captura jamais executou — e nenhum hook de captura (Stop / PostToolUse / PreCompact) está confirmado como ligado nesta máquina, então não há nada para executar.","doctor.msg.hook-activity.not-wired.fix":"Se quiser captura automática, execute `memesh install-hooks`. Se esta instalação é -binding.load-failed.fix":'Execute: cd "{root}" && npm install --omit=dev',"doctor.msg.shell-cli.not-on-path.summary":"O comando `memesh` não está disponível no seu terminal. Os recursos do Claude Code continuam funcionando — isso só afeta digitar `memesh` você mesmo.","doctor.msg.shell-cli.not-on-path.fix":"Execute `npm install -g @pcircle/memesh` para adicioná-lo. As duas instalações compartilham a mesma memória.","doctor.msg.dashboard.missing.summary":"Os arquivos do painel estão faltando.","doctor.msg.dashboard.missing.fix":"Gere-os com `cd dashboard && npm install && npm run build`.","doctor.msg.update-status.no-cache.summary":"O memesh ainda não conseguiu verificar se há versões mais novas.","doctor.msg.update-status.no-cache.fix":"Execute `memesh status` uma vez enquanto estiver online — isso guarda a resposta e este aviso desaparece.","doctor.msg.update-status.deprecated.summary":"A versão {version} foi retirada pelos mantenedores: {detail}","doctor.msg.update-status.deprecated.fix":"Atualize agora — execute `memesh update` (ou siga o seu método de instalação).","doctor.msg.update-status.deprecation-unknown.summary":"Não foi possível confirmar se a versão {version} ainda é segura de usar: {detail}","doctor.msg.update-status.deprecation-unknown.fix":"Execute `memesh status` online para tentar de novo.","doctor.msg.update-status.update-available.summary":"Há uma versão mais nova disponível: {latest} (você tem a {current}).","doctor.msg.update-status.update-available.fix":"Execute `memesh update` para atualizar.","doctor.msg.update-status.stale.summary":"A versão {version} está atual, mas a informação de atualização está velha.","doctor.msg.update-status.stale.fix":"Execute `memesh status` online para atualizá-la.","doctor.msg.http-probe.bad-status.summary":"O servidor local em {url} respondeu com um erro (HTTP {status}).","doctor.msg.http-probe.bad-status.fix":"Reinicie-o com `memesh serve` e confira os logs.","doctor.msg.http-probe.no-server.summary":"Nenhum rminez une session puis relancez `memesh doctor`. Si cela ne se rétablit pas, exécutez `memesh install-hooks`.","doctor.msg.hook-activity.stale-unconfirmed.summary":"Le hook session-summary a tourné pour la dernière fois il y a environ {hours} heures, et aucune écriture Claude Code n'est arrivée depuis 3 jours non plus. Si cette machine est passée à un autre agent (Codex / Gemini), c'est attendu ; si vous utilisez encore Claude Code ici, la capture s'est arrêtée.","doctor.msg.hook-activity.stale-unconfirmed.fix":"Si vous utilisez encore Claude Code sur cette machine : redémarrez-le, terminez une session, puis relancez `memesh doctor`. S'il ne récupère pas, lancez `memesh install-hooks`.","doctor.msg.hook-activity.query-failed.summary":"Impossible de lire l'activité des hooks dans la base de données : {detail}. L'état de la capture est inconnu, ce qui n'est pas la même chose que sain.","doctor.msg.hook-activity.query-failed.fix":"Lancez `memesh doctor --verbose` pour voir l'erreur complète, et vérifiez que ~/.memesh est lisible et que le disque n'est pas plein.","doctor.msg.hook-activity.stale-unknown.summary":"L'horodatage de la dernière exécution du hook {hook} est illisible (corrompu, ou écrit par une machine à l'horloge déréglée). L'état de la capture est « inconnu », ce qui n'est pas la même chose que « sain ».","doctor.msg.hook-activity.stale-unknown.fix":"Terminez une session de travail puis relancez `memesh doctor` — une nouvelle exécution écrase l'horodatage invalide.","doctor.msg.hook-activity.disabled.summary":"La capture automatique est désactivée (MEMESH_AUTO_CAPTURE ou autoCapture dans la configuration) — délibérément, le silence des hooks est donc attendu. Réactivez-la pour reprendre la capture.","doctor.msg.hook-activity.disabled-env.summary":"La capture automatique est désactivée par MEMESH_AUTO_CAPTURE=false dans l'environnement de ce shell. doctor ne voit que son propre environnement — si votre agent tourne sans cette variable, la capture là-bas n'est pas affectée.","doctor.msg.hook-activity.not-wired.summary":"Aucun hook de capture n'a jamais tourné — et aucun hook de capture (Stop / PostToolUse / PreCompact) n'est confirmé câblé sur cette machine, il n'y a donc rien à exécuter.","doctor.msg.hook-activity.not-wired.fix":"Pour la capture automatique, lancez `memesh install-hooks`. Si cette installation est MCP uniquement (Codex / Gemini), c'est normal et vous pouvez l'ignorer.","doctor.msg.hook-activity.stop-silent.summary":"Le hook {hook} s'enregistre, mais le hook session-summary n'a jamais tourné une seule fois en {hours} heures de suivi — la capture de session est peut-être cassée, masquée par la capture des commits.","doctor.msg.hook-activity.stop-silent.fix":"Terminez une session de travail puis relancez `memesh doctor`. Si session-summary n'a toujours pas tourné, lancez `memesh install-hooks` et redémarrez l'agent.","doctor.msg.hook-activity.never-ran-legacy.summary":"Aucun hook n'a enregistré le heartbeat, mais {captured} mémoires de capture automatique sont arrivées depuis le début du suivi — des hooks d'une version antérieure au suivi tournent probablement encore.","doctor.msg.hook-activity.never-ran-legacy.fix":"Mettez à jour les hooks memesh vers la version actuelle (plugin : `/plugin update memesh` ; npm : `memesh install-hooks`), puis redémarrez l'agent.","doctor.msg.node-runtime.too-old.summary":"Votre Node.js est plus ancien que ce que ce paquet prend en charge. {detail}","doctor.msg.node-runtime.too-old.fix":"Mettez Node.js à niveau vers {required} ou plus récent, puis relancez `memesh doctor`.","doctor.msg.native-binding.node-too-old.summary":"Le SQLite intégré à cette version de Node est trop ancien pour memesh : il ne peut pas charger la partie qui recherche par sens. La version complète est arrivée avec Node 22.13.","doctor.msg.native-binding.node-too-old.fix":"Passez à Node 22.13 ou plus récent, puis relancez `memesh doctor`.","doctor.msg.native-binding.not-installed.summary":"sqlite-vec itstempel des letzten Laufs des {hook}-Hooks ist unlesbar (beschädigt, oder von einer Maschine mit falscher Uhr geschrieben). Der Capture-Zustand ist „unbekannt", und das ist nicht dasselbe wie „gesund".',"doctor.msg.hook-activity.stale-unknown.fix":"Beenden Sie eine Arbeitssitzung und führen Sie `memesh doctor` erneut aus — ein frischer Lauf überschreibt den defekten Zeitstempel.","doctor.msg.hook-activity.disabled.summary":"Die automatische Erfassung ist ausgeschaltet (MEMESH_AUTO_CAPTURE oder autoCapture in der Konfiguration) — absichtlich, daher ist die Stille der Hooks zu erwarten. Zum Fortsetzen wieder einschalten.","doctor.msg.hook-activity.disabled-env.summary":"Die automatische Erfassung ist durch MEMESH_AUTO_CAPTURE=false in der Umgebung dieser Shell ausgeschaltet. doctor sieht nur seine eigene Umgebung — läuft Ihr Agent ohne diese Variable, ist die Erfassung dort nicht betroffen.","doctor.msg.hook-activity.not-wired.summary":"Es ist noch nie ein Capture-Hook gelaufen — und auf dieser Maschine ist kein Capture-Hook (Stop / PostToolUse / PreCompact) nachweislich verdrahtet, es gibt also nichts auszuführen.","doctor.msg.hook-activity.not-wired.fix":"Für automatische Erfassung führen Sie `memesh install-hooks` aus. Bei einer reinen MCP-Installation (Codex / Gemini) ist das erwartet und kann ignoriert werden.","doctor.msg.hook-activity.stop-silent.summary":"Der {hook}-Hook stempelt, aber der session-summary-Hook ist in den {hours} Stunden seit Beginn der Aufzeichnung kein einziges Mal gelaufen — die Sitzungserfassung ist womöglich kaputt, verdeckt durch die Commit-Erfassung.","doctor.msg.hook-activity.stop-silent.fix":"Beenden Sie eine Arbeitssitzung und führen Sie `memesh doctor` erneut aus. Läuft session-summary dann immer noch nicht, führen Sie `memesh install-hooks` aus und starten Sie den Agenten neu.","doctor.msg.hook-activity.never-ran-legacy.summary":"Kein Hook hat den Heartbeat gestempelt, aber seit Beginn der Aufzeichnung sind {captured} automatisch x":"Ejecuta `memesh doctor --verbose` para ver el error completo y comprueba que ~/.memesh se puede leer y que hay espacio en disco.","doctor.msg.hook-activity.stale-unknown.summary":"La marca de tiempo de la última ejecución del hook {hook} no se puede leer (corrupta, o escrita por una máquina con el reloj mal). El estado de la captura es «desconocido», que no es lo mismo que «sano».","doctor.msg.hook-activity.stale-unknown.fix":"Termina una sesión de trabajo y vuelve a ejecutar `memesh doctor` — una ejecución nueva sobrescribe la marca de tiempo dañada.","doctor.msg.hook-activity.disabled.summary":"La captura automática está desactivada (MEMESH_AUTO_CAPTURE o autoCapture en la configuración) — deliberadamente, así que el silencio de los hooks es lo esperado. Reactívala para volver a capturar sesiones.","doctor.msg.hook-activity.disabled-env.summary":"La captura automática está desactivada por MEMESH_AUTO_CAPTURE=false en el entorno de este shell. doctor solo ve su propio entorno — si tu agente corre sin esta variable, la captura allí no se ve afectada.","doctor.msg.hook-activity.not-wired.summary":"Ningún hook de captura se ha ejecutado nunca — y ningún hook de captura (Stop / PostToolUse / PreCompact) está confirmado como conectado en esta máquina, así que no hay nada que ejecutar.","doctor.msg.hook-activity.not-wired.fix":"Si quieres captura automática, ejecuta `memesh install-hooks`. Si esta instalación es solo MCP (Codex / Gemini), esto es lo esperado y puedes ignorarlo.","doctor.msg.hook-activity.stop-silent.summary":"El hook {hook} está sellando, pero el hook session-summary no se ha ejecutado ni una vez en las {hours} horas desde que empezó el seguimiento — la captura de sesiones puede estar rota, oculta tras la captura de commits.","doctor.msg.hook-activity.stop-silent.fix":"Termina una sesión de trabajo y vuelve a ejecutar `memesh doctor`. Si session-summary sigue sin ejecutarse, ejecuta `memesh install-hooks` y reinicia el agente.","doctor.msg.hook-activity.never-ran-legacy.summary":"Ningún hook ha sellado el latido, pero {captured} memorias de captura automática llegaron desde que empezó el seguimiento — probablemente siguen ejecutándose hooks de una versión anterior al seguimiento.","doctor.msg.hook-activity.never-ran-legacy.fix":"Actualiza los hooks de memesh a la versión actual (plugin: `/plugin update memesh`; npm: `memesh install-hooks`) y reinicia el agente.","doctor.msg.node-runtime.too-old.summary":"Tu Node.js es más antiguo de lo que este paquete admite. {detail}","doctor.msg.node-runtime.too-old.fix":"Actualiza Node.js a {required} o más nuevo, y luego ejecuta `memesh doctor` de nuevo.","doctor.msg.native-binding.node-too-old.summary":"El SQLite integrado en esta versión de Node es demasiado antiguo para memesh: no puede cargar la parte que busca por significado. La versión completa llegó en Node 22.13.","doctor.msg.native-binding.node-too-old.fix":"Actualiza Node a 22.13 o posterior y vuelve a ejecutar `memesh doctor`.","doctor.msg.native-binding.not-installed.summary":"sqlite-vec no está instalado. Los recuerdos se siguen guardando y encontrando por palabra clave — solo se apaga la búsqueda por significado.","doctor.msg.native-binding.not-installed.fix":"Ejecuta `npm install` en la carpeta que usa @pcircle/memesh.","doctor.msg.native-binding.load-failed.summary":"No se pudo cargar sqlite-vec: {detail}. La búsqueda vuelve a usar solo palabras clave.","doctor.msg.native-binding.load-failed.fix":'Ejecuta: cd "{root}" && npm install --omit=dev',"doctor.msg.shell-cli.not-on-path.summary":"El comando `memesh` no está disponible en tu terminal. Las funciones de Claude Code siguen funcionando — esto solo afecta a escribir `memesh` tú mismo.","doctor.msg.shell-cli.not-on-path.fix":"Ejecuta `npm install -g @pcircle/memesh` para añadirlo. Ambas instalaciones comparten la misma memoria.","doctor.msg.dashboard.missing.summary":"Faltan los archivos del panel.","doctor.msg.dashboard.missing.fix":"Constrúyelos con `cd
