name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['20', '22']

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint (hard gate — max-warnings 0)
        # Run BEFORE typecheck because lint is significantly faster and
        # most regressions land here first. Fail-fast cuts CI minutes
        # on bad PRs. Hard-gated at zero warnings since v4.2.0; new
        # `eslint-disable` comments require explicit justification.
        run: npm run lint

      - name: TypeScript check
        run: npm run typecheck

      - name: Version coherence (catches partial bumps)
        run: node scripts/check-version-coherence.mjs

      - name: Build
        run: npm run build

      - name: Generated hook-core is committed (F5 mirror drift gate)
        # `npm run build` regenerates scripts/hooks/_generated/ from the compiled
        # leaf modules. If a maintainer edited src/core/paths.ts or
        # src/storage/fts-index.ts but didn't regenerate + commit the hook copy,
        # the build above rewrote it and this diff is non-empty. Fail loudly so
        # the mirror can never silently drift (the class of bug behind the P0 FTS
        # omission). See scripts/generate-hook-core.mjs.
        shell: bash
        run: |
          if ! git diff --quiet -- scripts/hooks/_generated; then
            echo "::error::scripts/hooks/_generated is stale — run 'npm run build' and commit the regenerated files."
            git --no-pager diff -- scripts/hooks/_generated
            exit 1
          fi

      - name: Build dashboard
        run: cd dashboard && npm ci && npx vite build

      - name: Run tests
        run: npm test -- --run

      - name: Doctor (manifest + hooks integrity gate)
        # Must run AFTER `npm run build` so dist/skills-manifest.json
        # is present + current. Catches the "version bumped but
        # manifest stale" failure pattern that surfaces post-install
        # as `Skills + hooks integrity FAIL` for users.
        # Acceptable: Overall: PASS. Also acceptable: PASS_WITH_CONCERNS
        # where the only WARN is `Update status` (npm-published lag is
        # expected on feature branches).
        shell: bash
        run: |
          set -e
          OUTPUT=$(node dist/transports/cli/cli.js doctor 2>&1 || true)
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -qE '^\[FAIL\]'; then
            echo "::error::memesh doctor reported FAIL — see lines above"
            exit 1
          fi
          # Also gate on Skills+hooks integrity specifically — that one is
          # the highest-cost slip, easy to miss in a long doctor output.
          if echo "$OUTPUT" | grep -qE 'Skills \+ hooks integrity.*FAIL|Manifest verification failed'; then
            echo "::error::Skills+hooks integrity manifest mismatch detected"
            exit 1
          fi

  package-smoke:
    name: Packaged Artifact Smoke Test
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Build dashboard
        run: cd dashboard && npm ci && npx vite build

      - name: Verify packaged artifact
        run: npm run test:packaged

  dashboard-e2e-smoke:
    name: Packaged Dashboard E2E Smoke
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Build dashboard
        run: cd dashboard && npm ci && npx vite build

      - name: Run packaged dashboard e2e smoke
        run: npm run test:e2e-dashboard

  # The "verify before publish" gate (per user directive 2026-05-08).
  # Catches drift that unit tests miss — e.g., installation.test.ts asserting
  # 5 hook types when hooks.json shipped 6 went unnoticed for a full release
  # cycle until release-verify.sh exposed it. Run this on every PR so drift
  # is caught at PR-time, not at publish-time.
  release-verify:
    name: Release Verification Gate
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run release-verify (skip live LLM probe — no API key in CI)
        run: bash scripts/release-verify.sh --skip-llm-probe
