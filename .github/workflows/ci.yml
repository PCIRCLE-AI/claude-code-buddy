name: CI

on:
  push:
    # `main` is the only long-lived branch. `develop` used to be listed here
    # and was deleted along with this line: it had been fast-forwarded from
    # `main` after every merge and never merged into, so every sync re-tested a
    # byte-for-byte identical tree — 10 jobs, on a matrix whose slowest leg has
    # taken over 13 minutes. Free on a public repo (GitHub reports
    # `billable.duration_ms = 0` for every leg), which is exactly why it went
    # unnoticed: the currency here is wall-clock feedback time and queue slots,
    # not money.
    #
    # Pull requests are unaffected — the `pull_request` trigger below has no
    # branch filter, deliberately, so a PR based on another feature branch is
    # still built and tested.
    branches: [main]
  # Every pull request, not only the ones landing on main/develop.
  #
  # The filter used to be `branches: [main, develop]`, which reads as "test
  # what reaches the trunk" and behaves as "skip anything stacked". A PR whose
  # base is another feature branch got NO Build & Test at all — the review
  # showed four green checks and none of them had compiled the code. That is
  # the same defect as a gate that passes on nothing, one level up: work most
  # likely to need testing (a branch built on unmerged work) was the work
  # guaranteed not to get it.
  #
  # This was found the honest way: by stacking a PR that changed this very
  # matrix and watching the matrix not run on it.
  pull_request:

# Least privilege, stated here rather than inherited.
#
# Every other workflow in this directory declares its own; this one did not,
# so it ran on whatever the repository default happened to be. That default is
# currently `read`, which is why nothing was wrong — but it is a repository
# SETTING, changeable in the web UI by anyone with admin rights, with no diff
# and no review. The workflow that runs untrusted PR code is the last place to
# depend on a value that can move without a commit.
#
# Nothing here needs to write: the jobs install, lint, build, test, and run
# doctor. Publishing has its own workflow with its own scoped token.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One leg, ubuntu/24, alongside the matrix rather than inside it: coverage
  # instruments every worker and roughly doubles a run, and the numbers do not
  # differ by OS enough to buy three more instrumented legs. Before this job,
  # `npm run test:coverage` had ZERO automated callers — installed provider,
  # measured include globs, and nothing anywhere that would ever go red.
  coverage:
    name: Coverage floor
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          fetch-tags: true
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The suite spawns the built CLI, hooks and packaged binaries; without
      # dist/ those tests fail for a reason that has nothing to do with
      # coverage.
      - name: Build
        run: npm run build

      - name: Run tests with the coverage floor
        run: npm run test:coverage

  build-and-test:
    name: Build & Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    # 40, not 15 — measured, twice (2026-08-13, runs 31697660004 and
    # 31711750310, attempt 1 of each). A degraded windows-latest runner ran
    # the suite at ~5× its usual pace: steady per-file progress right up to
    # the kill, no hang — 51/127 and 48/127 test files done when the
    # 15-minute cap cancelled the job — which projects to ~34 minutes
    # end-to-end. A healthy Windows leg takes 6–10 minutes and ubuntu ~2, so
    # this cap costs nothing when runners are healthy; it exists so
    # runner-lottery slowness self-recovers as a slow green instead of a
    # cancelled leg a human has to notice and re-run. The suite is fully
    # serial (shared SQLite HOME) and spawn-heavy, which is why Windows
    # magnifies runner variance this much.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      # Which runtimes this matrix covers, and why each is here.
      #
      #   20 — GONE. It was kept while `engines` still said `>=20` on the
      #        rule written here: "the leg goes when the claim goes, not
      #        before." The claim went (`>=22.13.0`), so the leg went. Node 20
      #        was passing on all three OSes when it was removed — this was a
      #        support-policy change, not a fix.
      #   22 — LTS (Jod), and the floor. `engines` names 22.13.0 specifically
      #        because that is where `node:sqlite` stopped needing
      #        `--experimental-sqlite` and gained `loadExtension`,
      #        `enableLoadExtension` and `db.function`; the matrix cannot
      #        pin a patch, so this leg runs whatever 22.x is current and
      #        `tests/ci-matrix-covers-engines.test.ts` is what actually holds
      #        the two together.
      #   24 — LTS (Krypton). Was untested entirely, which is the gap this
      #        matrix change exists to close: the LTS line most users are
      #        actually on had no coverage at all.
      #   26 — Current, ubuntu only. Deliberately not on macOS or Windows:
      #        `better-sqlite3@12.9.0` publishes NO prebuilt binary for Node
      #        26's ABI (147). Measured: `prebuild-install warn install No
      #        prebuilt binaries found (target=26.5.1 ... platform=darwin)`
      #        followed by a `node-gyp rebuild`, which took 18s on
      #        macOS/arm64 and needs a full toolchain — MSVC on Windows. One
      #        Linux leg gives early warning that Node 26 works at all
      #        without paying for a source build on three runners.
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22', '24']
        include:
          - os: ubuntu-latest
            node: '26'

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          # `check-version-coherence.mjs` asks whether the version `main`
          # declares was ever tagged, and a default checkout fetches no tags at
          # all. The check refuses to pass on an empty tag list — "not checked"
          # is not "no problem found" — so without this it would fail every run
          # on main rather than silently agree with itself.
          fetch-tags: true
          # Measured, against this repository: `git clone --depth 1` brings down
          # 0 of the 65 `v*` tags. Full history is 24 MB / 1667 commits and
          # clones in 0.83s, so `fetch-depth: 0` buys certainty for a cost that
          # does not register next to a 13-minute matrix leg — and it is not a
          # guess about how `fetch-tags` behaves at depth 1.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint (hard gate — max-warnings 0)
        # Run BEFORE typecheck because lint is significantly faster and
        # most regressions land here first. Fail-fast cuts CI minutes
        # on bad PRs. Hard-gated at zero warnings since v4.2.0; new
        # `eslint-disable` comments require explicit justification.
        run: npm run lint

      # No separate Build step: the release gate below builds, because a gate
      # that only diffs committed output against an unbuilt tree reports "up to
      # date" for a tree whose source was edited and never rebuilt. Keeping both
      # meant every leg of this matrix compiled twice — visible as Windows going
      # from ~1m20 to ~5m20. The steps after this one still get a current dist/.

      - name: Release gates (the same ones the publish path runs)
        # `npm run verify:release`, not a hand-listed copy of what it contains.
        #
        # This used to enumerate typecheck + version coherence + mirror drift as
        # separate steps here, while `verify:release` — which publish-npm.yml
        # and `prepublishOnly` both call — held those PLUS the consumer-tree
        # dependency audit. The two lists drifted, and the missing one was the
        # audit, so `npm pack` -> install -> `npm audit` never ran on Windows at
        # all. That is where `execFileSync('npm')` failing with ENOENT (and then
        # `npm.cmd` with EINVAL) hid: the script could not run on Windows and
        # nothing on Windows ran the script.
        #
        # One name, so the matrix cannot enforce something different from the
        # publish path again. Must come after Build — the mirror gate diffs what
        # the build regenerates.
        #
        # Lint stays as its own step above for fail-fast; verify:release runs it
        # again for ~3s, which is the cost of having one authoritative list.
        run: npm run verify:release

      # No separate "Build dashboard" step either: the build the gate runs
      # produces it, via scripts/build-dashboard.mjs. Having both meant the
      # dashboard was built TWICE with different installs — an unpinned
      # `npm install` (node_modules absent on a clean runner) and an `npm ci`
      # here — and this one ran AFTER the release gates, so the mirror gate
      # diffed the artifact the unpinned install produced. That is how the
      # committed bundle could differ on Windows with every gate green.

      - name: Run tests
        run: npm test -- --run

      - name: Doctor (manifest + hooks integrity gate)
        # Must run AFTER the build (which the release gate performs) so
        # dist/skills-manifest.json
        # is present + current. Catches the "version bumped but
        # manifest stale" failure pattern that surfaces post-install
        # as `Skills + hooks integrity FAIL` for users.
        # Acceptable: Overall: PASS. Also acceptable: PASS_WITH_CONCERNS
        # where the only WARN is `Update status` (npm-published lag is
        # expected on feature branches).
        shell: bash
        run: |
          # Capture the exit code BEFORE anything can eat it. The previous
          # form was OUTPUT=$(... || true): the || true was needed so set -e
          # would not kill the step before the echo, but it also discarded
          # doctor's verdict, leaving the greps below as the only gate — and
          # a grep only matches the failure formats it was written against.
          # The CLI sets exit 1 exactly when overall status is FAIL;
          # PASS_WITH_CONCERNS exits 0, which is the accepted state here.
          set +e
          OUTPUT=$(node dist/transports/cli/cli.js doctor 2>&1)
          DOCTOR_EXIT=$?
          set -e
          echo "$OUTPUT"
          if [ "$DOCTOR_EXIT" -ne 0 ]; then
            echo "::error::memesh doctor exited $DOCTOR_EXIT — see lines above"
            exit 1
          fi
          if echo "$OUTPUT" | grep -qE '^\[FAIL\]'; then
            echo "::error::memesh doctor reported FAIL — see lines above"
            exit 1
          fi
          # Also gate on Skills+hooks integrity specifically — that one is
          # the highest-cost slip, easy to miss in a long doctor output.
          if echo "$OUTPUT" | grep -qE 'Skills \+ hooks integrity.*FAIL|Manifest verification failed'; then
            echo "::error::Skills+hooks integrity manifest mismatch detected"
            exit 1
          fi

  # The three jobs below used to carry `needs: build-and-test`, which made each
  # of them wait for ALL eleven matrix legs before starting. Measured on run
  # 30735734852: the matrix finished at 06:28:38, these started at 06:28:40, and
  # the run ended at 06:30:46 — a 2m06s serial tail on a 10m15s run, 20% of every
  # green PR, spent waiting rather than testing.
  #
  # The dependency bought nothing. Each of them checks out, runs its own
  # `npm ci` and its own build; none consumes an artifact the matrix produces.
  # What it did buy was "don't spend runners when the build is already broken",
  # and on a public repo that trade is backwards: GitHub reports
  # `billable.duration_ms = 0` for every leg of this workflow, so the currency is
  # wall-clock feedback time, and this was paying 2 minutes of it on every
  # PASSING run to save three ubuntu jobs on the rarer failing one.
  package-smoke:
    name: Packaged Artifact Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify packaged artifact
        run: npm run test:packaged

      # The version was written down in two places and both went stale: this
      # name said v4.7.3 while the script pinned v4.8.2. The script derives
      # every path it proves from package.json and the registry now, so the
      # step names the derivation — there is no version here to go stale.
      - name: Verify every derived packaged upgrade path
        run: npm run test:packaged:upgrade

  dashboard-e2e-smoke:
    name: Packaged Dashboard E2E Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Run packaged dashboard e2e smoke
        run: npm run test:e2e-dashboard

  # The "verify before publish" gate (per user directive 2026-05-08).
  # Catches drift that unit tests miss — e.g., installation.test.ts asserting
  # 5 hook types when hooks.json shipped 6 went unnoticed for a full release
  # cycle until release-verify.sh exposed it. Run this on every PR so drift
  # is caught at PR-time, not at publish-time.
  release-verify:
    name: Release Verification Gate
    runs-on: ubuntu-latest
    # This gate runs the same fully serial suite covered by the matrix's
    # measured degraded-runner policy above. Run 33299144173 reached the old
    # 15-minute cap while Vitest was still running; no test failure had been
    # reported before GitHub cancelled the job.
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run release-verify (skip live LLM probe — no API key in CI)
        run: bash scripts/release-verify.sh --skip-llm-probe
