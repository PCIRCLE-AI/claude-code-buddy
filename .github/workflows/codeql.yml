name: CodeQL Security Analysis

on:
  push:
    branches: [main]
  # Every pull request — same reasoning as ci.yml. A PR based on another
  # feature branch used to get the AI reviewers (multi-model-review.yml has no
  # branch filter) and neither the build nor this scan: reviewed but never
  # compiled and never scanned, which is the worst of the three states to be
  # in and the least obvious from a page of green checks.
  pull_request:
  schedule:
    - cron: '0 0 * * 1'

# Supersede an in-flight run when a new commit arrives on the same ref.
# Without this, pushing three times in a minute leaves three full runs
# competing for runners and only the last one's result matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript']

    steps:
      # F9: pin first-party GitHub actions to commit SHA so a tag-rewrite
      # or maintainer push to v4 cannot silently inject behaviour. SHAs
      # resolved 2026-05-04 from refs/tags/v4. Bump together when upgrading.
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ed410739ba306e4ebe5e123421a6bd694e494a2b # v4
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@ed410739ba306e4ebe5e123421a6bd694e494a2b # v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@ed410739ba306e4ebe5e123421a6bd694e494a2b # v4
        with:
          category: "/language:${{ matrix.language }}"
