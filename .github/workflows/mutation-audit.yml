name: Mutation Audit

# Sampled mutation testing on a schedule, not per-commit: a run is ~30-60
# minutes of fully serial suite executions, which has no place on the PR
# critical path. Monthly keeps a drift alarm ringing; workflow_dispatch
# exists so a score can be reproduced on demand with a chosen seed —
# reproducing the published score from a clean checkout with the same seed
# is one of this repository's done criteria.
#
# The scheduled run uses the run number as its seed ON PURPOSE: a fixed seed
# would re-test the same twelve mutants forever, which measures nothing new.
# Every run prints its N and seed, so any scheduled result is reproducible
# after the fact via dispatch.
on:
  schedule:
    - cron: '17 3 3 * *'
  workflow_dispatch:
    inputs:
      sample:
        description: 'How many mutants per operator set'
        default: '12'
      seed:
        description: 'PRNG seed (fixed default so dispatch runs reproduce the published score)'
        default: '20260804'

permissions:
  contents: read

jobs:
  mutation:
    name: Sampled mutation (classic + blank)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          fetch-tags: true
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Cache the local embedding model
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ github.workspace }}/.memesh-model-cache
          key: onnx-Xenova-all-MiniLM-L6-v2-${{ runner.os }}-v1

      - name: Install dependencies
        run: npm ci

      # The suite spawns dist/ binaries; without a build those tests fail for
      # reasons that have nothing to do with the mutants.
      - name: Build
        run: npm run build

      - name: Classic operator set
        env:
          SAMPLE: ${{ inputs.sample || '12' }}
          SEED: ${{ inputs.seed || github.run_number }}
          MEMESH_MODEL_CACHE_DIR: ${{ github.workspace }}/.memesh-model-cache
        run: node scripts/audit/mutation-sample.mjs

      - name: Blank-out operator set (the C2 detector for src/)
        env:
          OPERATORS: blank
          SAMPLE: ${{ inputs.sample || '12' }}
          SEED: ${{ inputs.seed || github.run_number }}
          MEMESH_MODEL_CACHE_DIR: ${{ github.workspace }}/.memesh-model-cache
        run: node scripts/audit/mutation-sample.mjs
